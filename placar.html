  :root {
    --bg: #eef1e7;
    --surface: #ffffff;
    --surface-2: #e6ebdd;
    --ink: #16241c;
    --ink-soft: #57655b;
    --border: #d7ddcf;
    --accent: #1f8a4c;
    --accent-strong: #146138;
    --accent-soft: #dbeee0;
    --gold: #93690a;
    --gold-soft: #f3e6c8;
    --danger: #a5271e;
    --danger-soft: #f6dedc;
    --shadow: 0 1px 2px rgba(20, 30, 20, 0.06), 0 10px 26px rgba(20, 30, 20, 0.07);
    --font-display: 'Anton', 'Arial Narrow', sans-serif;
    --font-body: 'Karla', system-ui, -apple-system, 'Segoe UI', sans-serif;
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1712;
      --surface: #17231b;
      --surface-2: #1d2a20;
      --ink: #edf2ea;
      --ink-soft: #a9b6ac;
      --border: #263429;
      --accent: #43d17f;
      --accent-strong: #2fae66;
      --accent-soft: #1b3524;
      --gold: #e3ba52;
      --gold-soft: #3a2f16;
      --danger: #ff8478;
      --danger-soft: #3a1c1a;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 10px 26px rgba(0, 0, 0, 0.35);
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --bg: #0f1712;
    --surface: #17231b;
    --surface-2: #1d2a20;
    --ink: #edf2ea;
    --ink-soft: #a9b6ac;
    --border: #263429;
    --accent: #43d17f;
    --accent-strong: #2fae66;
    --accent-soft: #1b3524;
    --gold: #e3ba52;
    --gold-soft: #3a2f16;
    --danger: #ff8478;
    --danger-soft: #3a1c1a;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 10px 26px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }

  :root[data-theme="light"] {
    --bg: #eef1e7;
    --surface: #ffffff;
    --surface-2: #e6ebdd;
    --ink: #16241c;
    --ink-soft: #57655b;
    --border: #d7ddcf;
    --accent: #1f8a4c;
    --accent-strong: #146138;
    --accent-soft: #dbeee0;
    --gold: #93690a;
    --gold-soft: #f3e6c8;
    --danger: #a5271e;
    --danger-soft: #f6dedc;
    --shadow: 0 1px 2px rgba(20, 30, 20, 0.06), 0 10px 26px rgba(20, 30, 20, 0.07);
    color-scheme: light;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    line-height: 1.45;
  }

  .wrap {
    max-width: 880px;
    margin: 0 auto;
    padding: 0 16px 64px;
  }

  a { color: var(--accent-strong); }

  button {
    font-family: inherit;
    cursor: pointer;
  }
  button:focus-visible,
  summary:focus-visible,
  [tabindex]:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
    border-radius: 4px;
  }

  .tabular { font-variant-numeric: tabular-nums; }

  /* ---------- Hero ---------- */
  .hero {
    background: linear-gradient(180deg, var(--accent-soft), transparent 70%);
    border-bottom: 1px solid var(--border);
    padding: 28px 16px 22px;
  }

    var prevRank = 0;
    sorted.forEach(function (item, i) {
      var m = metricFn(item);
      if (prevMetric !== null && m === prevMetric) {
        item._rank = prevRank;
      } else {
        item._rank = i + 1;
        prevRank = item._rank;
        prevMetric = m;
      }
    });
    return sorted;
  }

  // ---------------------------------------------------------------------
  // Formatação
  // ---------------------------------------------------------------------

  function fmtPts(n) {
    var s = (n > 0 ? '+' : '') + n;
    return s;
  }

  function medalClass(r) {
    if (r === 1) return ' medal-1';
    if (r === 2) return ' medal-2';
    if (r === 3) return ' medal-3';
    return '';
  }

  function medalGlyph(r) {
    if (r === 1) return '🥇';
    if (r === 2) return '🥈';
    if (r === 3) return '🥉';
    return String(r) + '.';
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // ---------------------------------------------------------------------
  // Render: cabeçalho / avatares / última atualização
  // ---------------------------------------------------------------------

  function renderStatic() {
    var updatedTxt = formatDateBR(LAST_UPDATED);
    document.getElementById('last-updated').textContent = 'Atualizado em ' + updatedTxt;
    document.getElementById('footer-updated').textContent = updatedTxt;

    var strip = document.getElementById('avatar-strip');
    strip.innerHTML = PARTICIPANTS.map(function (p) {
      return '<span class="avatar-chip">' + p.emoji + ' ' + escapeHtml(p.name) + '</span>';
    }).join('');
  }

  function formatDateBR(iso) {
    var parts = iso.split('-');
    return parts[2] + '/' + parts[1] + '/' + parts[0];
  }

  // ---------------------------------------------------------------------
  // Render: contagem regressiva
  // ---------------------------------------------------------------------

  function startCountdown() {
    var target = new Date(COMPETITION_TARGET).getTime();
    var daysEl = document.getElementById('cd-days');
    var unitEl = document.getElementById('cd-days-unit');
    var timeEl = document.getElementById('cd-time');

    function tick() {
      var now = Date.now();
      var diff = target - now;

      if (diff <= 0 && diff > -86400000) {
        daysEl.textContent = 'HOJE';
        unitEl.textContent = '🏆';
        timeEl.textContent = 'é hoje!';
        return;
      }
      if (diff <= -86400000) {
        daysEl.textContent = '—';
        unitEl.textContent = '';
        timeEl.textContent = 'INTERMED encerrada';
        return;
      }

      var totalSeconds = Math.floor(diff / 1000);
      var days = Math.floor(totalSeconds / 86400);
      var hours = Math.floor((totalSeconds % 86400) / 3600);
      var minutes = Math.floor((totalSeconds % 3600) / 60);
      var seconds = totalSeconds % 60;

      daysEl.textContent = String(days);
      unitEl.textContent = days === 1 ? 'dia' : 'dias';
      timeEl.textContent =
        pad(hours) + ':' + pad(minutes) + ':' + pad(seconds);

      requestAnimationFrame(function () {
        setTimeout(tick, 250);
      });
    }

    function pad(n) { return n < 10 ? '0' + n : String(n); }

    tick();
  }

  // ---------------------------------------------------------------------
  // Render: tabela de classificação
  // ---------------------------------------------------------------------

  var activeCategory = 'total';
  var expandedKey = null;
  var totalsResult = computeTotals();

  var TAB_TITLES = { total: 'Geral', fsf: 'Futsal', academia: 'Academia' };
  var COLUMN_SETS = {
    total: [
      { field: 'fsf', label: 'Futsal' },
      { field: 'academia', label: 'Academia' },
      { field: 'bonus', label: 'Bônus' },
      { field: 'total', label: 'Total' }
    ],
    fsf: [{ field: 'fsf', label: 'Pontos' }],
    academia: [{ field: 'academia', label: 'Pontos' }]
  };

  function renderRankingTable() {
    document.getElementById('ranking-title').textContent = TAB_TITLES[activeCategory];

    var cols = COLUMN_SETS[activeCategory];
    var isActiveCol = function (field) {
      return activeCategory === 'total' ? field === 'total' : true;
    };

    var head = document.getElementById('ranking-head');
    head.innerHTML = '<tr><th style="width:34px">#</th><th>Participante</th>' +
      cols.map(function (c) { return '<th class="num">' + c.label + '</th>'; }).join('') +
      '</tr>';

    var metricFn = function (p) { return totalsResult.totals[p.key][activeCategory === 'total' ? 'total' : activeCategory]; };
    var ranked = rank(PARTICIPANTS, metricFn);

    var body = document.getElementById('ranking-body');
    var html = '';

    ranked.forEach(function (p) {
      var t = totalsResult.totals[p.key];
      var isExpanded = expandedKey === p.key;

      html += '<tr class="row">';
      html += '<td class="rank-badge' + medalClass(p._rank) + '">' + medalGlyph(p._rank) + '</td>';
      html += '<td><button class="row-btn" data-toggle="' + p.key + '" aria-expanded="' + isExpanded + '">' +
        p.emoji + ' ' + escapeHtml(p.name) + '</button></td>';
      cols.forEach(function (c) {
        var val = t[c.field];
        html += '<td class="num points tabular' + (isActiveCol(c.field) ? ' active-col' : '') + (val < 0 ? ' neg' : '') + '">' + fmtPts(val) + '</td>';
      });
      html += '</tr>';

      if (isExpanded) {
        html += '<tr class="detail-row"><td colspan="' + (2 + cols.length) + '">' + renderBreakdown(t) + '</td></tr>';
      }
    });

    body.innerHTML = html;

    Array.prototype.forEach.call(body.querySelectorAll('[data-toggle]'), function (btn) {
      btn.addEventListener('click', function () {
        var key = btn.getAttribute('data-toggle');
        expandedKey = expandedKey === key ? null : key;
        renderRankingTable();
      });
    });
  }

  function renderBreakdown(t) {
    var cats = ['fsf', 'academia', 'bonus'];
    var any = false;
    var out = '';
    cats.forEach(function (cat) {
      var rulesInCat = RULES.filter(function (r) { return r.category === cat && t.byRuleCount[r.key]; });
      if (!rulesInCat.length) return;
      any = true;
      out += '<div class="detail-group"><div class="detail-group-label">' + CATEGORY_LABELS[cat] + '</div><div class="detail-chips">';
      rulesInCat.forEach(function (r) {
        var count = t.byRuleCount[r.key];
        var pts = t.byRule[r.key];
        out += '<span class="detail-chip">' + r.icon + ' ' + escapeHtml(r.label) +
          (count > 1 ? ' ×' + count : '') +
          '<span class="pts' + (pts < 0 ? ' neg' : '') + '">' + fmtPts(pts) + '</span></span>';
      });
      out += '</div></div>';
    });
    if (!any) out = '<span class="detail-empty">Ainda sem pontos lançados.</span>';
    return out;
  }

  function setupTabs() {
    var tabs = document.getElementById('ranking-tabs');
    Array.prototype.forEach.call(tabs.querySelectorAll('.tab-btn'), function (btn) {
      btn.addEventListener('click', function () {
        activeCategory = btn.getAttribute('data-cat');
        expandedKey = null;
        Array.prototype.forEach.call(tabs.querySelectorAll('.tab-btn'), function (b) {
          b.setAttribute('aria-selected', b === btn ? 'true' : 'false');
        });
        renderRankingTable();
      });
    });
  }

  // ---------------------------------------------------------------------
  // Render: destaques
  // ---------------------------------------------------------------------

  function renderDestaques() {
    var grid = document.getElementById('destaque-grid');
    grid.innerHTML = DESTAQUES.map(function (def) {
      var scored = PARTICIPANTS.map(function (p) {
        var t = totalsResult.totals[p.key];
        var metric = 0;
        def.rules.forEach(function (rk) { metric += (t.byRule[rk] || 0); });
        return { p: p, metric: metric };
      }).filter(function (x) { return x.metric > 0; });

      var body;
      if (!scored.length) {
        body = '<p class="destaque-empty">Ainda sem dados nessa categoria — volte depois do próximo treino.</p>';
      } else {
        var ranked = rank(scored, function (x) { return x.metric; });
        var top = ranked.filter(function (x) { return x._rank <= 3; });
        body = '<ul class="destaque-list">' + top.map(function (x) {
          return '<li class="destaque-item">' +
            '<span class="destaque-rank' + medalClass(x._rank) + '">' + medalGlyph(x._rank) + '</span>' +
            '<span class="destaque-name">' + x.p.emoji + ' ' + escapeHtml(x.p.name) + '</span>' +
            '<span class="destaque-pts tabular">' + fmtPts(x.metric) + '</span>' +
            '</li>';
        }).join('') + '</ul>';
      }

      return '<div class="destaque-card">' +
        '<p class="destaque-title">' + escapeHtml(def.label) + '</p>' +
        '<p class="destaque-criterion">' + escapeHtml(def.criterion) + '</p>' +
        body +
        '</div>';
    }).join('');
  }

  // ---------------------------------------------------------------------
  // Render: regras
  // ---------------------------------------------------------------------

  function groupByConsecutiveIcon(rules) {
    var groups = [];
    rules.forEach(function (r) {
      var last = groups[groups.length - 1];
      if (last && last.icon === r.icon) {
        last.items.push(r);
      } else {
        groups.push({ icon: r.icon, items: [r] });
      }
    });
    return groups;
  }

  function ruleLineHtml(r, withIcon) {
    var label = (withIcon ? r.icon + ' ' : '') + escapeHtml(r.label);
    return '<div class="rule-line"><span>' + label + '</span>' +
      '<span class="rule-pts' + (r.points < 0 ? ' neg' : '') + ' tabular">' + fmtPts(r.points) + '</span></div>';
  }

  function rulesColHtml(cat) {
    var rulesInCat = RULES.filter(function (r) { return r.category === cat; });
    var groups = groupByConsecutiveIcon(rulesInCat);
    var groupsHtml = groups.map(function (g) {
      if (g.items.length > 1) {
        return '<div class="rule-group"><div class="rule-group-icon">' + g.icon + '</div>' +
          g.items.map(function (r) { return ruleLineHtml(r, false); }).join('') + '</div>';
      }
      return '<div class="rule-group">' + ruleLineHtml(g.items[0], true) + '</div>';
    }).join('');
    return '<div class="rules-col"><h3>' + CATEGORY_LABELS[cat] + '</h3>' + groupsHtml + '</div>';
  }

  function renderRules() {
    var panel = document.getElementById('rules-panel');
    panel.innerHTML = rulesColHtml('fsf') +
      '<div class="rules-col-stack">' + rulesColHtml('academia') + rulesColHtml('bonus') + '</div>';

    var toggle = document.getElementById('rules-toggle');
    toggle.addEventListener('click', function () {
      var expanded = toggle.getAttribute('aria-expanded') === 'true';
      toggle.setAttribute('aria-expanded', String(!expanded));
      panel.hidden = expanded;
    });
  }

  // ---------------------------------------------------------------------
  // Avisos de dados inválidos
  // ---------------------------------------------------------------------

  function renderWarnings() {
    if (!totalsResult.warnings.length) return;
    var slot = document.getElementById('warning-slot');
    slot.innerHTML = '<div class="warning-banner"><strong>⚠️ Confira os dados:</strong><ul>' +
      totalsResult.warnings.map(function (w) { return '<li>' + escapeHtml(w) + '</li>'; }).join('') +
      '</ul></div>';
  }

  // ---------------------------------------------------------------------
  // Init
  // ---------------------------------------------------------------------

  function init() {
    renderStatic();
    startCountdown();
    setupTabs();
    renderRankingTable();
    renderDestaques();
    renderRules();
    renderWarnings();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
