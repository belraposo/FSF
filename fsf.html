<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FSF</title>
<style>
  :root {
    --bg: #f5f6f2;
    --surface: #ffffff;
    --surface-2: #edece5;
    --text: #1b211d;
    --text-muted: #5b655f;
    --border: #e2e0d8;
    --accent-game: #1f6f5c;
    --accent-game-bg: #e4efec;
    --accent-training: #235d94;
    --accent-training-bg: #dde8f4;
    --accent-possible: #9aa39c;
    --accent-possible-bg: #eeefec;
    --accent-absence: #b4483a;
    --accent-absence-bg: #f6e5e2;
    --accent-featured: #9a6b12;
    --accent-featured-bg: #faedcd;
    --today-ring: #1f6f5c;
    --shadow: 0 1px 2px rgba(27, 33, 29, 0.06), 0 1px 1px rgba(27, 33, 29, 0.04);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121613;
      --surface: #1b211d;
      --surface-2: #232a25;
      --text: #edeee9;
      --text-muted: #9aa39c;
      --border: #2a322c;
      --accent-game: #4fbfa0;
      --accent-game-bg: #1c2e29;
      --accent-training: #6fa8dc;
      --accent-training-bg: #16283a;
      --accent-possible: #6b756e;
      --accent-possible-bg: #232a25;
      --accent-absence: #e08277;
      --accent-absence-bg: #3a221e;
      --accent-featured: #e3b34d;
      --accent-featured-bg: #3a2f14;
      --today-ring: #4fbfa0;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 1px 1px rgba(0, 0, 0, 0.2);
    }
  }
  :root[data-theme="dark"] {
    --bg: #121613;
    --surface: #1b211d;
    --surface-2: #232a25;
    --text: #edeee9;
    --text-muted: #9aa39c;
    --border: #2a322c;
    --accent-game: #4fbfa0;
    --accent-game-bg: #1c2e29;
    --accent-training: #6fa8dc;
    --accent-training-bg: #16283a;
    --accent-possible: #6b756e;
    --accent-possible-bg: #232a25;
    --accent-absence: #e08277;
    --accent-absence-bg: #3a221e;
    --accent-featured: #e3b34d;
    --accent-featured-bg: #3a2f14;
    --today-ring: #4fbfa0;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 1px 1px rgba(0, 0, 0, 0.2);
  }
  :root[data-theme="light"] {
    --bg: #f5f6f2;
    --surface: #ffffff;
    --surface-2: #edece5;
    --text: #1b211d;
    --text-muted: #5b655f;
    --border: #e2e0d8;
    --accent-game: #1f6f5c;
    --accent-game-bg: #e4efec;
    --accent-training: #235d94;
    --accent-training-bg: #dde8f4;
    --accent-possible: #9aa39c;
    --accent-possible-bg: #eeefec;
    --accent-featured: #9a6b12;
    --accent-featured-bg: #faedcd;
    --accent-absence: #b4483a;
    --accent-absence-bg: #f6e5e2;
    --today-ring: #1f6f5c;
    --shadow: 0 1px 2px rgba(27, 33, 29, 0.06), 0 1px 1px rgba(27, 33, 29, 0.04);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .display {
    font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif;
    font-weight: 800;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 20px 16px 64px;
  }

  header.top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
  }
  .title-block { min-width: 0; }
  header.top h1 {
    font-size: clamp(1.3rem, 4vw, 1.6rem);
    margin: 0;
    white-space: nowrap;
  }
  header.top .ball { font-size: 1.1em; }
  .countdown {
    margin-top: 4px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .countdown strong {
    color: var(--accent-featured);
    font-weight: 800;
  }
  .countdown .emoji-anim {
    display: inline-block;
    animation: bounce-emoji 1.4s ease-in-out infinite;
  }
  @keyframes bounce-emoji {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-3px) rotate(-8deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .countdown .emoji-anim { animation: none; }
  }
  header.top .sub {
    font-size: 0.8rem;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .tabs {
    display: flex;
    gap: 4px;
    background: var(--surface-2);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 20px;
    position: sticky;
    top: 8px;
    z-index: 10;
    box-shadow: var(--shadow);
  }
  .tabs button {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-family: inherit;
    font-weight: 700;
    font-size: 0.9rem;
    padding: 10px 8px;
    border-radius: 9px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .tabs button.active {
    background: var(--surface);
    color: var(--text);
    box-shadow: var(--shadow);
  }
  .tabs button:focus-visible {
    outline: 2px solid var(--accent-game);
    outline-offset: 2px;
  }

  .panel { display: none; }
  .panel.active { display: block; }

  /* ---- Agenda list ---- */
  .month-heading {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    font-weight: 700;
    margin: 24px 0 10px;
  }
  .month-heading:first-child { margin-top: 0; }

  .week-divider {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 14px 0 8px;
    color: var(--text-muted);
    font-size: 0.66rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    font-variant-numeric: tabular-nums;
  }
  .week-divider::before,
  .week-divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .event-card {
    display: grid;
    grid-template-columns: 56px 1fr;
    gap: 14px;
    background: var(--surface);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
    box-shadow: var(--shadow);
    border-left: 4px solid var(--accent-training);
  }
  .event-card.game { border-left-color: var(--accent-game); }
  .event-card.possible {
    border-left-color: var(--accent-possible);
    box-shadow: none;
    border: 1px dashed var(--border);
    border-left: 4px dashed var(--accent-possible);
  }
  .event-card.featured {
    border: 1.5px solid var(--accent-featured);
    border-left: 4px solid var(--accent-featured);
    background: linear-gradient(135deg, var(--accent-featured-bg), var(--surface) 70%);
    box-shadow: 0 3px 12px rgba(154, 107, 18, 0.2);
  }
  .featured .event-date .dom, .featured .event-date .dow { color: var(--accent-featured); }
  .featured .event-title { font-size: 1.15rem; }

  .event-date {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-variant-numeric: tabular-nums;
    border-right: 1px solid var(--border);
    padding-right: 10px;
  }
  .event-date .dow {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    font-weight: 700;
  }
  .event-date .dom {
    font-size: 1.3rem;
    font-weight: 800;
    line-height: 1.1;
  }
  .possible .event-date .dom, .possible .event-date .dow { color: var(--accent-possible); }

  .event-body { min-width: 0; }
  .event-top {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .tag {
    font-size: 0.66rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 2px 7px;
    border-radius: 100px;
  }
  .tag.training { background: var(--accent-training-bg); color: var(--accent-training); }
  .tag.game { background: var(--accent-game-bg); color: var(--accent-game); }
  .tag.possible { background: var(--accent-possible-bg); color: var(--accent-possible); }
  .tag.featured { background: var(--accent-featured-bg); color: var(--accent-featured); }

  .event-title {
    font-weight: 700;
    font-size: 0.98rem;
  }
  .possible .event-title { font-weight: 500; font-size: 0.9rem; color: var(--text-muted); }

  .event-meta {
    margin-top: 2px;
    font-size: 0.82rem;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }
  .event-meta span + span::before { content: " · "; }
  .meta-ou {
    font-weight: 700;
    margin: 0 2px;
    font-size: 0.7rem;
    text-transform: uppercase;
  }

  .event-note {
    margin-top: 4px;
    font-size: 0.78rem;
    font-style: italic;
    color: var(--text-muted);
  }

  .absence-row {
    margin-top: 6px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    align-items: center;
  }
  .absence-label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--accent-absence);
    font-weight: 700;
    margin-right: 2px;
  }
  .chip.absence {
    font-size: 0.75rem;
    background: var(--accent-absence-bg);
    color: var(--accent-absence);
    padding: 2px 8px;
    border-radius: 100px;
    font-weight: 600;
  }
  .possible .absence-label { color: var(--accent-possible); }
  .possible .chip.absence {
    color: var(--accent-possible);
    background: var(--accent-possible-bg);
  }
  .restriction-block {
    background: var(--surface);
    border-radius: 12px;
    padding: 12px 14px;
    margin-top: 8px;
    box-shadow: var(--shadow);
  }
  .restriction-chips {
    margin-top: 6px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .chip.restriction {
    font-size: 0.75rem;
    background: var(--accent-absence-bg);
    color: var(--accent-absence);
    padding: 3px 9px;
    border-radius: 100px;
    font-weight: 600;
  }

  /* ---- Calendar grid ---- */
  .cal-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .cal-nav button {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    width: 34px;
    height: 34px;
    border-radius: 10px;
    font-size: 1rem;
    cursor: pointer;
  }
  .cal-nav button:focus-visible { outline: 2px solid var(--accent-game); outline-offset: 2px; }
  .cal-nav h2 {
    font-size: 1.05rem;
    margin: 0;
    text-transform: capitalize;
  }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 18px;
  }
  .cal-dow {
    text-align: center;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    font-weight: 700;
    padding-bottom: 4px;
  }
  .cal-cell {
    min-height: 62px;
    background: var(--surface);
    border-radius: 9px;
    padding: 4px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    cursor: pointer;
    border: 1px solid transparent;
    text-align: left;
    font-family: inherit;
    color: inherit;
  }
  .cal-cell:focus-visible { outline: 2px solid var(--accent-game); outline-offset: 1px; }
  .cal-cell.empty { background: transparent; cursor: default; }
  .cal-cell.today { border-color: var(--today-ring); }
  .cal-cell.selected { box-shadow: 0 0 0 2px var(--accent-game) inset; }
  .cal-daynum {
    font-size: 0.72rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--text-muted);
  }
  .cal-cell.today .cal-daynum { color: var(--accent-game); }
  .cal-bar {
    height: 5px;
    border-radius: 3px;
    background: var(--accent-training);
    width: 100%;
  }
  .cal-bar.game { background: var(--accent-game); }
  .cal-bar.possible {
    background: none;
    border: 1.2px dashed var(--accent-possible);
    height: 4px;
  }
  .cal-bar.restriction { background: var(--accent-absence); height: 3px; }
  .cal-bar.featured { background: var(--accent-featured); height: 7px; box-shadow: 0 0 0 1px var(--accent-featured-bg); }

  .day-detail {
    background: var(--surface);
    border-radius: 12px;
    padding: 14px;
    box-shadow: var(--shadow);
  }
  .day-detail h3 {
    margin: 0 0 8px;
    font-size: 0.95rem;
    text-transform: capitalize;
  }
  .day-detail .empty-note {
    color: var(--text-muted);
    font-size: 0.85rem;
  }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 16px;
    margin-top: 16px;
    font-size: 0.72rem;
    color: var(--text-muted);
  }
  .legend .item { display: flex; align-items: center; gap: 5px; }
  .legend .dot { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
  .legend .dot.game { background: var(--accent-game); }
  .legend .dot.training { background: var(--accent-training); }
  .legend .dot.possible { border: 1.2px dashed var(--accent-possible); background: transparent; }
  .legend .dot.restriction { background: var(--accent-absence); }
  .legend .dot.featured { background: var(--accent-featured); }

  @media (prefers-reduced-motion: no-preference) {
    .event-card, .cal-cell { transition: transform 0.1s ease; }
  }

  .banner {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 7;
    overflow: hidden;
  }
  .banner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 30%;
    display: block;
  }
  .banner-scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.55), rgba(0,0,0,0) 60%);
  }
  .banner-credit {
    position: absolute;
    right: 10px;
    bottom: 6px;
    font-size: 0.62rem;
    color: rgba(255,255,255,0.8);
    letter-spacing: 0.02em;
  }
</style>

  function periodoDoHorario(horario) {
    const hour = parseInt(horario.split(":")[0], 10);
    if (hour < 12) return "manhã";
    if (hour < 18) return "tarde";
    return "noite";

  // Períodos-base cobertos por um texto de período de possibilidade (ex: "Dia todo" → os 3).
  function periodosDoTexto(periodoTexto) {
    const t = periodoTexto.toLowerCase();
    if (t.includes("dia todo")) return ["manhã", "tarde", "noite"];
    if (t.includes("manhã")) return ["manhã"];
    if (t.includes("tarde")) return ["tarde"];
    if (t.includes("noite")) return ["noite"];

  function eventPeriodos(ev) {

  // Segunda-feira da semana de uma data (semana começa na segunda, termina no domingo).
  function mondayOf(date) {
    const d = new Date(date);
    const day = d.getDay();
    d.setDate(d.getDate() + (day === 0 ? -6 : 1 - day));
    d.setHours(0, 0, 0, 0);
    return d;
  }
  function weekLabel(monday) {
    const sunday = new Date(monday);
    sunday.setDate(sunday.getDate() + 6);
    const dd = n => String(n).padStart(2, "0");
    const sameMonth = monday.getMonth() === sunday.getMonth();
    const start = sameMonth ? dd(monday.getDate()) : `${dd(monday.getDate())}/${dd(monday.getMonth() + 1)}`;
    const end = `${dd(sunday.getDate())}/${dd(sunday.getMonth() + 1)}`;
    return `${start}–${end}`;
  }

  function renderAgenda() {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const todayIso = isoDate(today);

    const sorted = [...EVENTS]
      .filter(ev => ev.date >= todayIso)
      .sort((a, b) => {
        const dateCmp = a.date.localeCompare(b.date);
        return dateCmp !== 0 ? dateCmp : agendaTypeOrder(a) - agendaTypeOrder(b);
      });
    const el = document.getElementById("panel-agenda");
    el.innerHTML = "";

    if (!sorted.length) {
      el.innerHTML = `<p class="empty-note">Nenhum evento futuro agendado.</p>`;
      return;

    let currentMonthKey = "";
    let currentWeekKey = "";

    sorted.forEach(ev => {
      const d = parseDate(ev.date);
      const monthKey = d.getFullYear() + "-" + d.getMonth();
      const monday = mondayOf(d);
      const weekKey = isoDate(monday);
      if (monthKey !== currentMonthKey) {
        currentMonthKey = monthKey;
        currentWeekKey = weekKey;
        const h = document.createElement("div");
        h.className = "month-heading";
        h.textContent = MONTHS[d.getMonth()] + " de " + d.getFullYear();

        w.className = "week-divider";

        <div class="event-body">
          <div class="event-top"><span class="tag featured">Competição</span></div>
          <div class="event-title">🏆 INTERMED</div>
        </div>
      </div>`;
    }

    if (dayRestrictions.length) {
      html += `<div class="restriction-block">
        <span class="absence-label">Restrições</span>
        <div class="restriction-chips">${dayRestrictions.map(r =>
          `<span class="chip restriction">${r.pessoa} · ${r.periodos.join("/")}${r.motivo ? " · " + r.motivo : ""}</span>`
        ).join("")}</div>
      </div>`;
    }

    el.innerHTML = html;
  }

  function shiftMonth(delta) {
    calCursor.setMonth(calCursor.getMonth() + delta);
    calCursor = new Date(calCursor);
    renderCalendar();
  }

  renderAgenda();
  renderCalendar();
</script>
